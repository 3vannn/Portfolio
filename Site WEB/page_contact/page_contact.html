<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Evan BENOIT</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        /* Barre de navigation */
        nav {
            background: #333;
            color: white;
            padding: 15px;
            position: fixed;
            width: 100%;
            top: 0;
        }

        nav ul {
            display: flex;
            list-style: none;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            margin: 0 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #00adb5;
        }

        section {
            padding: 80px 20px;
            min-height: 100vh;
        }

        #presentation {
            background: #f4f4f4;
            text-align: center;
        }

        #competences {
            background: #e2e2e2;
        }

        #projets {
            background: #f4f4f4;
        }

        #contact {
            background: #e2e2e2;
        }

        h1, h2 {
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .skills, .projects {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 250px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        form {
            max-width: 500px;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        input, textarea {
            margin-bottom: 10px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #00adb5;
        }
    </style>
</head>
<body>

    <!-- Barre de navigation -->
    <nav>
        <ul>
            <li><a href="#presentation">Présentation</a></li>
            <li><a href="#competences">Compétences</a></li>
            <li><a href="#projets">Projets</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section id="contact">
        <div class="container">
            <h2>Contact</h2>
            <form>
                <input type="text" placeholder="Votre nom" required>
                <input type="email" placeholder="Votre email" required>
                <textarea placeholder="Votre message" rows="5" required></textarea>
                <button type="submit">Envoyer</button>
            </form>
        </div>
    </section>

</body>
</html>
